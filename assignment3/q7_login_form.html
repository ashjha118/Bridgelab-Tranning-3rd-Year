<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form</title>
</head>
<body>

    <h1>Login Form</h1>

    <form action="#" method="post">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <!-- 
            CSRF (Cross-Site Request Forgery) token:
            This hidden field carries a unique, secret token generated by the server.
            When the form is submitted, the server checks that the token matches
            the one it issued. This proves the request genuinely came from the
            site's own form and not from a malicious third-party site tricking
            the user's browser into submitting a forged request.
        -->
        <input type="hidden" name="csrf_token" value="dummyCSRFTokenValue12345">

        <input type="submit" value="Login">

    </form>

</body>
</html>
