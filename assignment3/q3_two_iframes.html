<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 3 - Two Stacked Iframes</title>
</head>
<body>

    <h1>My Introduction and Hobby</h1>

    <!-- First iframe: displays the introduction page -->
    <p>Introduction:</p>
    <iframe src="intro.html" width="500" height="200" title="Introduction Page"></iframe>

    <!-- Second iframe: displays the favorite hobby page -->
    <!-- Both iframes use the same width and height attributes so they appear balanced -->
    <p>Favorite Hobby:</p>
    <iframe src="hobby.html" width="500" height="200" title="Favorite Hobby Page"></iframe>

</body>
</html>
