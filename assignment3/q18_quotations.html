<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 18 - Quotations</title>
</head>
<body>

    <h1>Long and Short Quotations</h1>

    <!-- Long quotation using blockquote, includes an HTML entity (&amp;) -->
    <blockquote>
        "Education is the most powerful weapon which you can use to change the world,
        and it applies to reading &amp; writing both."
    </blockquote>

    <!-- Short quotation using the q tag, embedded inside a paragraph -->
    <p>
        As the old saying goes, <q>knowledge is power</q>, and it remains true today.
    </p>

</body>
</html>
