<!DOCTYPE html>
<html lang="en">
<head>

    <!-- title: sets the text shown in the browser tab -->
    <title>Question 20 - Head Elements Demo</title>

    <!-- meta charset: defines the character encoding used by the page -->
    <meta charset="UTF-8">

    <!-- meta description: summarizes the page content for search engines -->
    <meta name="description" content="A demonstration page showing all important head elements in HTML.">

    <!-- meta author: identifies who created the page -->
    <meta name="author" content="Student Name">

    <!-- base: sets the default base URL for all relative links/resources on the page -->
    <base href="https://example.com/">

    <!-- link: connects an external resource, here a favicon shown in the browser tab -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- style: reserved for internal CSS rules (left empty per assignment instructions) -->
    <style></style>

    <!-- script: reserved for internal JavaScript code (left empty per assignment instructions) -->
    <script></script>

</head>
<body>

    <h1>Head Elements Demonstration</h1>
    <p>This page's head section demonstrates title, meta, base, link, style, and script tags.</p>

</body>
</html>
