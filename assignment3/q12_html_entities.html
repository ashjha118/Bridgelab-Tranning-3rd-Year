<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 12 - HTML Entities</title>
</head>
<body>

    <h1>HTML Entities Demonstration</h1>

    <!-- Paragraph showing reserved characters and symbols using their HTML entities -->
    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos; <br>
        Copyright symbol: &copy; <br>
        Trademark symbol: &trade; <br>
        Registered symbol: &reg;
    </p>

</body>
</html>
