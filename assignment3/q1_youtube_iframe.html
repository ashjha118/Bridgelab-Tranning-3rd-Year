<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 1 - YouTube Video Embed</title>
</head>
<body>

    <!-- Heading for the page -->
    <h1>Embedded YouTube Video</h1>

    <!-- 
        The iframe below embeds a YouTube video.
        Width and height are set using percentage values (not pixels)
        so the video resizes responsively when the browser window is resized.
    -->
    <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        width="80%" 
        height="60%" 
        title="YouTube video player"
        allowfullscreen>
    </iframe>

</body>
</html>
