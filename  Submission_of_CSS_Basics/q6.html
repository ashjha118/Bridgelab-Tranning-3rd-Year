<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>

  <h1 class="page-title">Nature Gallery</h1>

  <section class="gallery">

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400" alt="Forest">
      <div class="caption">Misty Forest</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400" alt="Mountains">
      <div class="caption">Mountain Peaks</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Beach">
      <div class="caption">Sunny Beach</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400" alt="Lake">
      <div class="caption">Calm Lake</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400" alt="Valley">
      <div class="caption">Green Valley</div>
    </div>

    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=400" alt="Desert">
      <div class="caption">Golden Desert</div>
    </div>

  </section>

</body>
</html>
