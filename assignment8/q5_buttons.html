<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Q5 - Button Collection</title>
  <link rel="stylesheet" href="q5_buttons.css" />
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
    <p>Hover, click, and focus buttons to see all pseudo-class effects.</p>
  </header>

  <main>
    <!-- Primary -->
    <section class="group">
      <h2>Primary Button</h2>
      <button class="btn btn-primary">Primary Action</button>
    </section>

    <!-- Secondary -->
    <section class="group">
      <h2>Secondary Button</h2>
      <button class="btn btn-secondary">Secondary Action</button>
    </section>

    <!-- Outline -->
    <section class="group">
      <h2>Outline Button</h2>
      <button class="btn btn-outline">Outline Style</button>
    </section>

    <!-- Disabled -->
    <section class="group">
      <h2>Disabled Button</h2>
      <button class="btn btn-primary" disabled>Disabled</button>
    </section>

    <!-- Focus demo -->
    <section class="group">
      <h2>Focus Button <small>(Tab to it)</small></h2>
      <button class="btn btn-focus-demo">Tab Here</button>
    </section>

    <!-- Danger -->
    <section class="group">
      <h2>Danger Button</h2>
      <button class="btn btn-danger">Delete</button>
    </section>

    <!-- Success -->
    <section class="group">
      <h2>Success Button</h2>
      <button class="btn btn-success">Confirm</button>
    </section>

    <!-- Ghost -->
    <section class="group">
      <h2>Ghost Button</h2>
      <button class="btn btn-ghost">Ghost Action</button>
    </section>
  </main>

  <footer>
    <p>Assignment 8 — Q5 | Button Collection</p>
  </footer>
</body>
</html>
