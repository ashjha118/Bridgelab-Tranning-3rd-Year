<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Q2 - Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2_tooltip.css" />
</head>
<body>
  <header>
    <h1>CSS Tooltip Demonstration</h1>
    <p>Hover over the elements below to see pure-CSS tooltips fade in.</p>
  </header>

  <main>
    <div class="tooltip-wrap">
      <span class="icon" data-tip="This is a Home icon tooltip">🏠 Home</span>
    </div>

    <div class="tooltip-wrap">
      <span class="icon" data-tip="Settings let you customize the app">⚙️ Settings</span>
    </div>

    <div class="tooltip-wrap">
      <span class="icon" data-tip="Send a message to your team">✉️ Message</span>
    </div>

    <div class="tooltip-wrap">
      <span class="icon" data-tip="Upload files from your device">📁 Upload</span>
    </div>

    <div class="tooltip-wrap">
      <span class="icon" data-tip="View your profile and account info">👤 Profile</span>
    </div>
  </main>

  <footer>
    <p>Assignment 8 — Q2 | CSS Tooltips</p>
  </footer>
</body>
</html>
