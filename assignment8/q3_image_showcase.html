<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Q3 - Image Showcase</title>
  <link rel="stylesheet" href="q3_image_showcase.css" />
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
    <p>Hover over any image to see the effect.</p>
  </header>

  <main>
    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/mountain/400/300" alt="Mountain" />
        <div class="overlay"></div>
      </div>
      <figcaption>Mountain Peak</figcaption>
    </figure>

    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/ocean/400/300" alt="Ocean" />
        <div class="overlay"></div>
      </div>
      <figcaption>Ocean Waves</figcaption>
    </figure>

    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/forest/400/300" alt="Forest" />
        <div class="overlay"></div>
      </div>
      <figcaption>Dense Forest</figcaption>
    </figure>

    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/city/400/300" alt="City" />
        <div class="overlay"></div>
      </div>
      <figcaption>City Lights</figcaption>
    </figure>

    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/desert/400/300" alt="Desert" />
        <div class="overlay"></div>
      </div>
      <figcaption>Desert Dunes</figcaption>
    </figure>

    <figure class="img-card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/river/400/300" alt="River" />
        <div class="overlay"></div>
      </div>
      <figcaption>Calm River</figcaption>
    </figure>
  </main>

  <footer>
    <p>Assignment 8 — Q3 | Image Showcase Layout</p>
  </footer>
</body>
</html>
