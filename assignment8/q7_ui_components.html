<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Q7 - UI Components</title>
  <link rel="stylesheet" href="q7_ui_components.css" />
</head>
<body>
  <header>
    <h1>User Interface Components</h1>
    <p>Search bar, buttons, and dropdown — pure HTML &amp; CSS</p>
  </header>

  <main>
    <div class="card">
      <!-- Search Bar -->
      <section class="comp-section">
        <h2>Search Bar</h2>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" placeholder="Search anything…" />
          <button class="search-btn">Search</button>
        </div>
      </section>

      <!-- Buttons -->
      <section class="comp-section">
        <h2>Action Buttons</h2>
        <div class="btn-row">
          <button class="btn btn-primary">Save</button>
          <button class="btn btn-secondary">Cancel</button>
          <button class="btn btn-outline">Preview</button>
          <button class="btn btn-danger">Delete</button>
        </div>
      </section>

      <!-- Dropdown -->
      <section class="comp-section">
        <h2>Dropdown Menu</h2>
        <div class="select-wrap">
          <select class="dropdown">
            <option value="">Select an option…</option>
            <option value="a">Option Alpha</option>
            <option value="b">Option Beta</option>
            <option value="c">Option Gamma</option>
            <option value="d">Option Delta</option>
          </select>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>Assignment 8 — Q7 | UI Components</p>
  </footer>
</body>
</html>
