<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Student Report Page</title>
</head>
<body>

    <!-- School name -->
    <h1>Sunrise Public School - Student Report Card</h1>

    <table border="1" cellpadding="6" cellspacing="0">
        <tr>
            <th>Subject</th>
            <th title="Marks obtained out of 100">Marks Obtained</th>
            <th>Maximum Marks</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
            <td title="A1 = Outstanding">A1</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>88</td>
            <td>100</td>
            <td title="A2 = Excellent">A2</td>
        </tr>
        <tr>
            <td>English</td>
            <td>85</td>
            <td>100</td>
            <td title="A2 = Excellent">A2</td>
        </tr>
        <tr>
            <td>Social Studies</td>
            <td>79</td>
            <td>100</td>
            <td title="B1 = Very Good">B1</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
            <td title="A1 = Outstanding">A1</td>
        </tr>

        <!-- Total and Percentage row, spans subject + marks columns -->
        <tr>
            <td colspan="2" title="Sum of all subject marks"><strong>Total</strong></td>
            <td colspan="2" title="Total percentage across all subjects"><strong>Percentage: 87.8%</strong></td>
        </tr>
    </table>

</body>
</html>
