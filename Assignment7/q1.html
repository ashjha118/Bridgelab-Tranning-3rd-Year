<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q1 - Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Borders and Padding Demonstration</h1>
    <p>Hover over each box to see the border color change smoothly.</p>
  </header>

  <main>
    <section class="box-row">
      <div class="box solid">
        <h2>Solid Border</h2>
        <p>Padding: 10px</p>
      </div>

      <div class="box dashed">
        <h2>Dashed Border</h2>
        <p>Padding: 20px</p>
      </div>

      <div class="box double">
        <h2>Double Border</h2>
        <p>Padding: 15px</p>
      </div>

      <div class="box groove">
        <h2>Groove Border</h2>
        <p>Padding: 25px</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Assignment 7 - Question 1</p>
  </footer>
</body>
</html>
