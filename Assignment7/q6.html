<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q6 - CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
    <p>Hover over each box to see the transformation applied.</p>
  </header>

  <main class="box-row">
    <div class="box-wrapper">
      <div class="box rotate-box">Rotate</div>
      <p class="label">rotate(45deg)</p>
    </div>

    <div class="box-wrapper">
      <div class="box scale-box">Scale</div>
      <p class="label">scale(1.3)</p>
    </div>

    <div class="box-wrapper">
      <div class="box translate-box">Translate</div>
      <p class="label">translate(20px, -20px)</p>
    </div>

    <div class="box-wrapper">
      <div class="box skew-box">Skew</div>
      <p class="label">skew(15deg, 5deg)</p>
    </div>
  </main>

  <footer>
    <p>Assignment 7 - Question 6</p>
  </footer>
</body>
</html>
