<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Outline and Focus Styling Form</title>
  <link rel="stylesheet" href="q9.css">
</head>
<body>
  <header>
    <h1>Outline and Focus Styling Form</h1>
  </header>

  <main>
    <form>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" class="outline-solid" placeholder="Solid outline, offset 3px">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" class="outline-dashed" placeholder="Dashed outline, offset 5px">
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" class="outline-dotted" placeholder="Dotted outline, offset 2px">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Type your message here"></textarea>
      </div>

      <button type="button">Submit</button>
    </form>
  </main>

  <footer>
    <p>Assignment 7 - Question 9</p>
  </footer>
</body>
</html>
