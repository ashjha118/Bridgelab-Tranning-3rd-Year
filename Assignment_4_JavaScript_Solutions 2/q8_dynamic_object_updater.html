<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dynamic Object Updater</title></head>
<body>
    <h2>Edit User Details</h2>
    <form id="userForm">
        <p><label>Name: <input id="name" type="text" required></label></p>
        <p><label>Email: <input id="email" type="email" required></label></p>
        <p><label>Age: <input id="age" type="number" min="1" required></label></p>
        <button type="submit">Update User</button>
    </form>
    <h3>Updated User Object</h3>
    <pre id="userDetails"></pre>
    <script src="q8_dynamic_object_updater.js"></script>
</body>
</html>
