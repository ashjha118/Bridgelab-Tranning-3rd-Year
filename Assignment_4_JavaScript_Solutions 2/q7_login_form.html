<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Validation</title></head>
<body>
    <h2>Login Form</h2>
    <form id="loginForm">
        <p><label>Username: <input id="username" type="text" required></label></p>
        <p><label>Password: <input id="password" type="password" required></label></p>
        <button type="submit">Login</button>
    </form>
    <p id="loginMessage" aria-live="polite"></p>
    <script src="q7_login_form_validation.js"></script>
</body>
</html>
