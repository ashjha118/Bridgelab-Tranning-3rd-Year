<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Cards with Media Queries</title>
  <link rel="stylesheet" href="responsive-cards-media-queries.css">
</head>
<body>
  <header>
    <h1>Responsive Cards with Media Queries</h1>
  </header>

  <main class="card-row">
    <div class="card">
      <h2>Card One</h2>
      <p>Resize the window to see this layout adapt.</p>
    </div>
    <div class="card">
      <h2>Card Two</h2>
      <p>Cards adjust from 4 to 2 to 1 columns.</p>
    </div>
    <div class="card">
      <h2>Card Three</h2>
      <p>Hover changes the card's background color.</p>
    </div>
    <div class="card">
      <h2>Card Four</h2>
      <p>Equal spacing is kept between every card.</p>
    </div>
  </main>

  <footer>
    <p>Assignment 9 - Question 3</p>
  </footer>
</body>
</html>
