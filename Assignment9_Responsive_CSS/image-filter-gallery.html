<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
    <p>Hover over an image to remove its filter.</p>
  </header>

  <main class="gallery">
    <figure class="gallery-item">
      <div class="photo blur-img"></div>
      <figcaption>Blur Filter</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="photo grayscale-img"></div>
      <figcaption>Grayscale Filter</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="photo sepia-img"></div>
      <figcaption>Sepia Filter</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="photo brightness-img"></div>
      <figcaption>Brightness Filter</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="photo contrast-img"></div>
      <figcaption>Contrast Filter</figcaption>
    </figure>

    <figure class="gallery-item">
      <div class="photo hue-img"></div>
      <figcaption>Hue-Rotate Filter</figcaption>
    </figure>
  </main>

  <footer>
    <p>Assignment 9 - Question 1</p>
  </footer>
</body>
</html>
