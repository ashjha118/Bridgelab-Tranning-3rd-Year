<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header>
    <h1>Before and After Filter Comparison</h1>
    <p>Hover over the right image to fade away its filter.</p>
  </header>

  <main class="compare-row">
    <figure class="compare-item">
      <div class="compare-photo original"></div>
      <figcaption>Original</figcaption>
    </figure>

    <figure class="compare-item">
      <div class="compare-photo filtered"></div>
      <figcaption>Filtered (Brightness)</figcaption>
    </figure>
  </main>

  <footer>
    <p>Assignment 9 - Question 8</p>
  </footer>
</body>
</html>
