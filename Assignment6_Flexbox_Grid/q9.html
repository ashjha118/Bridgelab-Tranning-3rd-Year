<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q9 - Card Flip Animation</title>
  <link rel="stylesheet" href="q9.css">
</head>
<body>
  <div class="page-center">
    <div class="flip-card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <h2>Space Exploration</h2>
          <div class="card-image">Image</div>
        </div>
        <div class="flip-card-back">
          <p>Hover reveals this description. Space exploration is the
             discovery and study of outer space using space technology
             and crewed or robotic missions.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
