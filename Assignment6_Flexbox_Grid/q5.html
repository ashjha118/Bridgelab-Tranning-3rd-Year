<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q5 - Pricing Section (Flexbox)</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <header>
    <h1>Our Pricing Plans</h1>
  </header>

  <main class="pricing-row">
    <div class="pricing-card">
      <h2>Basic</h2>
      <p class="price">$9<span>/mo</span></p>
      <ul>
        <li>1 User</li>
        <li>5 Projects</li>
        <li>Email Support</li>
      </ul>
    </div>

    <div class="pricing-card featured">
      <h2>Pro</h2>
      <p class="price">$29<span>/mo</span></p>
      <ul>
        <li>5 Users</li>
        <li>Unlimited Projects</li>
        <li>Priority Support</li>
      </ul>
    </div>

    <div class="pricing-card">
      <h2>Enterprise</h2>
      <p class="price">$59<span>/mo</span></p>
      <ul>
        <li>Unlimited Users</li>
        <li>Unlimited Projects</li>
        <li>24/7 Support</li>
      </ul>
    </div>
  </main>

  <footer>
    <p>Assignment 6 - Question 5</p>
  </footer>
</body>
</html>
